# QGroundControl Hikvision optimized Windows build
name: Build QGroundControl Hikvision Stable

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-qgc-hikvision.yml'
      - 'tools/patch_qgc_dual_hikvision.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  QGC_REF: 527296e2d2d4ee95f52e0001db4ecb7d317fe814
  AQT_SOURCE: git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95

jobs:
  build:
    name: Windows AMD64 Release
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout QGroundControl
        uses: actions/checkout@v7
        with:
          repository: mavlink/qgroundcontrol
          ref: ${{ env.QGC_REF }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Checkout customization scripts
        uses: actions/checkout@v7
        with:
          path: custom-build
          persist-credentials: false

      - name: Apply dual Hikvision customization
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/custom-build/tools/patch_qgc_dual_hikvision.py"

      - name: Verify patch
        shell: bash
        run: |
          grep -n "GST_RTSP_LOWER_TRANS_TCP" src/VideoManager/VideoReceiver/GStreamer/GstSourceFactory.cc
          grep -n "wait-for-keyframe" src/VideoManager/VideoReceiver/GStreamer/GstSourceFactory.cc
          grep -n "kRtspMinLatencyMs" src/VideoManager/VideoReceiver/GStreamer/GstSourceFactory.cc
          grep -n "camera2Video" src/VideoManager/VideoManager.cc
          grep -n "hikvisionCam2SubUrl" src/Settings/Video.SettingsGroup.json

      - name: Build Setup
        id: build-setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows
          qt-arch: win64_msvc2022_64
          aqt-source: ${{ env.AQT_SOURCE }}
          build-type: Release

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          preset: Windows
          extra-args: >-
            -DQGC_BUILD_PORTABLE_TESTS=OFF
            -DQGC_ENABLE_GST_VIDEOSTREAMING=ON
            -DQGC_CPACK_GENERATOR=NSIS

      - name: Resolve GStreamer root
        id: gst-root
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/cmake_helper.py" cache-var \
            --build-dir "${RUNNER_TEMP}/build" \
            --name GStreamer_ROOT_DIR \
            --required \
            --output-key gst_root

      - name: Add GStreamer to PATH
        shell: bash
        run: echo "${GST_ROOT}/bin" >> "$GITHUB_PATH"
        env:
          GST_ROOT: ${{ steps.gst-root.outputs.gst_root }}

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Create installer
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}\build
          build-type: Release
          target: qgc-package
          parallel: 'false'

      - name: Prepare named installer
        shell: pwsh
        run: |
          $src = "${{ runner.temp }}\build\QGroundControl-installer-AMD64.exe"
          if (-not (Test-Path -LiteralPath $src)) {
            Write-Error "Installer not found at $src"
            Get-ChildItem "${{ runner.temp }}\build" -Filter "*.exe" -Recurse | Select-Object FullName
            exit 1
          }
          $out = "${{ runner.temp }}\artifact"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath $src -Destination "$out\QGroundControl-Hikvision-DualCam.exe"
          Get-FileHash "$out\QGroundControl-Hikvision-DualCam.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  QGroundControl-Hikvision-DualCam.exe" } |
            Set-Content "$out\QGroundControl-Hikvision-DualCam.exe.sha256"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: QGroundControl-Hikvision-DualCam-Windows
          path: |
            ${{ runner.temp }}/artifact/QGroundControl-Hikvision-DualCam.exe
            ${{ runner.temp }}/artifact/QGroundControl-Hikvision-DualCam.exe.sha256
          retention-days: 30
          compression-level: 0
